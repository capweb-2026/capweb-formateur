<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boussole — l’assistant de la formation</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <h1 id="titre">🧭 Boussole</h1>
    <p>L’assistant de la formation Renforcement web. Réponses à règles pour l’instant, pas encore d’IA.</p>
  </header>
  <main>
    <section aria-labelledby="titre-chat">
      <h2 id="titre-chat">Discussion</h2>
      <p id="accueil"></p>
      <ul id="messages" aria-live="polite" aria-label="Messages"></ul>
      <div id="suggestions" role="group" aria-label="Questions suggérées"></div>
      <form id="chat-form">
        <label for="message">Votre message (280 caractères maximum)</label>
        <textarea id="message" name="message" rows="3" maxlength="280" required></textarea>
        <button type="submit">Envoyer</button>
      </form>
      <button type="button" id="effacer">Effacer la conversation</button>
      <p id="status" role="status"></p>
    </section>
  </main>
  <footer>
    <p>Serveur local fourni pour l’atelier. <span id="version">version…</span></p>
  </footer>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
